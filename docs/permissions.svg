<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">13 tools, and the token permissions each group needs</title>
  <desc id="d">The Cloudflare MCP server's 13 tools in five groups, each with the Cloudflare API token permission it needs: zones need Zone Read, DNS needs DNS Edit, Workers KV needs Workers KV Storage Edit and an account ID, cache needs Cache Purge, analytics needs Analytics Read. The minimum token is Zone Read plus DNS Edit.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,4.00% { stroke-opacity: .35; } 7.00%,18.00% { stroke-opacity: 1; } 22.00%,100% { stroke-opacity: .35; } } .g0 { animation: g0 10.0s infinite; }
    @keyframes u0 { 0%,6.00% { opacity: 0; transform: translateY(4px); } 9.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .u0 { animation: u0 10.0s infinite; }
    @keyframes g1 { 0%,13.00% { stroke-opacity: .35; } 16.00%,27.00% { stroke-opacity: 1; } 31.00%,100% { stroke-opacity: .35; } } .g1 { animation: g1 10.0s infinite; }
    @keyframes u1 { 0%,15.00% { opacity: 0; transform: translateY(4px); } 18.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .u1 { animation: u1 10.0s infinite; }
    @keyframes g2 { 0%,22.00% { stroke-opacity: .35; } 25.00%,36.00% { stroke-opacity: 1; } 40.00%,100% { stroke-opacity: .35; } } .g2 { animation: g2 10.0s infinite; }
    @keyframes u2 { 0%,24.00% { opacity: 0; transform: translateY(4px); } 27.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .u2 { animation: u2 10.0s infinite; }
    @keyframes g3 { 0%,31.00% { stroke-opacity: .35; } 34.00%,45.00% { stroke-opacity: 1; } 49.00%,100% { stroke-opacity: .35; } } .g3 { animation: g3 10.0s infinite; }
    @keyframes u3 { 0%,33.00% { opacity: 0; transform: translateY(4px); } 36.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .u3 { animation: u3 10.0s infinite; }
    @keyframes g4 { 0%,40.00% { stroke-opacity: .35; } 43.00%,54.00% { stroke-opacity: 1; } 58.00%,100% { stroke-opacity: .35; } } .g4 { animation: g4 10.0s infinite; }
    @keyframes u4 { 0%,42.00% { opacity: 0; transform: translateY(4px); } 45.00%,95% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } } .u4 { animation: u4 10.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="960" height="420" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">13 tools · grant only what you use</text>
  <text x="30" y="78" font-size="15" class="muted">One API token. Each group needs one permission, so leave out the ones you don't want it to touch.</text>
  <rect class="g0" x="30" y="120" width="176" height="200" rx="12" fill="#f6821f" fill-opacity=".07" stroke="#f6821f" stroke-width="2"/><text x="44" y="146" font-size="15" font-weight="700">Zones</text><text x="192" y="147" text-anchor="end" font-size="17" font-weight="800" style="fill:#f6821f">2</text><text x="44" y="172" font-size="10.5" class="mono" style="fill:#f6821f">list_zones</text><text x="44" y="192" font-size="10.5" class="mono" style="fill:#f6821f">get_zone</text><g class="u0"><rect x="40" y="276" width="156" height="32" rx="8" fill="#0b0f18" stroke="#f6821f" stroke-opacity=".6"/><text x="118.0" y="296" text-anchor="middle" font-size="10.5" font-weight="700">🔑 Zone · Read</text></g><text x="118.0" y="338" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".08em" style="fill:#f6821f">MINIMUM</text><rect class="g1" x="214" y="120" width="176" height="200" rx="12" fill="#ffb02e" fill-opacity=".07" stroke="#ffb02e" stroke-width="2"/><text x="228" y="146" font-size="15" font-weight="700">DNS</text><text x="376" y="147" text-anchor="end" font-size="17" font-weight="800" style="fill:#ffb02e">4</text><text x="228" y="172" font-size="10.5" class="mono" style="fill:#ffb02e">list_dns_records</text><text x="228" y="192" font-size="10.5" class="mono" style="fill:#ffb02e">create_dns_record</text><text x="228" y="212" font-size="10.5" class="mono" style="fill:#ffb02e">update_dns_record</text><text x="228" y="232" font-size="10.5" class="mono" style="fill:#ffb02e">delete_dns_record</text><g class="u1"><rect x="224" y="276" width="156" height="32" rx="8" fill="#0b0f18" stroke="#ffb02e" stroke-opacity=".6"/><text x="302.0" y="296" text-anchor="middle" font-size="10.5" font-weight="700">🔑 DNS · Edit</text></g><text x="302.0" y="338" text-anchor="middle" font-size="10" font-weight="700" letter-spacing=".08em" style="fill:#ffb02e">MINIMUM</text><rect class="g2" x="398" y="120" width="176" height="200" rx="12" fill="#b58cff" fill-opacity=".07" stroke="#b58cff" stroke-width="2"/><text x="412" y="146" font-size="15" font-weight="700">Workers KV</text><text x="560" y="147" text-anchor="end" font-size="17" font-weight="800" style="fill:#b58cff">5</text><text x="412" y="172" font-size="10.5" class="mono" style="fill:#b58cff">list_kv_namespaces</text><text x="412" y="192" font-size="10.5" class="mono" style="fill:#b58cff">list_kv_keys</text><text x="412" y="212" font-size="10.5" class="mono" style="fill:#b58cff">read_kv_value</text><text x="412" y="232" font-size="10.5" class="mono" style="fill:#b58cff">write_kv_value</text><text x="412" y="252" font-size="10.5" class="mono" style="fill:#b58cff">delete_kv_value</text><g class="u2"><rect x="408" y="276" width="156" height="32" rx="8" fill="#0b0f18" stroke="#b58cff" stroke-opacity=".6"/><text x="486.0" y="296" text-anchor="middle" font-size="10.5" font-weight="700">🔑 Workers KV · Edit</text></g><rect class="g3" x="582" y="120" width="176" height="200" rx="12" fill="#3ec7ff" fill-opacity=".07" stroke="#3ec7ff" stroke-width="2"/><text x="596" y="146" font-size="15" font-weight="700">Cache</text><text x="744" y="147" text-anchor="end" font-size="17" font-weight="800" style="fill:#3ec7ff">1</text><text x="596" y="172" font-size="10.5" class="mono" style="fill:#3ec7ff">purge_cache</text><g class="u3"><rect x="592" y="276" width="156" height="32" rx="8" fill="#0b0f18" stroke="#3ec7ff" stroke-opacity=".6"/><text x="670.0" y="296" text-anchor="middle" font-size="10.5" font-weight="700">🔑 Cache Purge · Purge</text></g><rect class="g4" x="766" y="120" width="176" height="200" rx="12" fill="#3ddc84" fill-opacity=".07" stroke="#3ddc84" stroke-width="2"/><text x="780" y="146" font-size="15" font-weight="700">Analytics</text><text x="928" y="147" text-anchor="end" font-size="17" font-weight="800" style="fill:#3ddc84">1</text><text x="780" y="172" font-size="10.5" class="mono" style="fill:#3ddc84">get_zone_analytics</text><g class="u4"><rect x="776" y="276" width="156" height="32" rx="8" fill="#0b0f18" stroke="#3ddc84" stroke-opacity=".6"/><text x="854.0" y="296" text-anchor="middle" font-size="10.5" font-weight="700">🔑 Analytics · Read</text></g>
  <rect x="30" y="356" width="900" height="44" rx="12" fill="#161d2b" stroke="#2c3750"/>
  <text x="46" y="383" font-size="13"><tspan font-weight="700">Smallest useful token:</tspan> Zone · Read + DNS · Edit. Add the others when you need them. Workers KV also needs <tspan class="mono" style="fill:#d9c6ff">CLOUDFLARE_ACCOUNT_ID</tspan>.</text>
</svg>
