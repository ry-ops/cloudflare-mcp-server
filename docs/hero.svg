<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Cloudflare MCP Server: DNS, cache and Workers KV in a conversation</title>
  <desc id="d">You ask to point staging.example.com at 203.0.113.10 and purge the cache. The server calls list_zones, create_dns_record and purge_cache on the Cloudflare API; a new proxied A record appears in the zone's DNS table and a purge wave sweeps across. All names and addresses are examples.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#f6821f"/><stop offset=".6" stop-color="#ffb02e"/><stop offset="1" stop-color="#ffd88a"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6ebf5; }
    .muted { fill: #8b96ad; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes ask { 0%,1.67% { opacity: 0; transform: translateY(8px); } 4.58%,95.00% { opacity: 1; transform: translateY(0); } 97.50%,100% { opacity: 0; } } .ask { animation: ask 12.0s infinite; }
    @keyframes c1 { 0%,10.83% { opacity: 0; } 13.75%,95.00% { opacity: 1; } 97.50%,100% { opacity: 0; } } .c1 { animation: c1 12.0s infinite; }
    @keyframes c2 { 0%,20.00% { opacity: 0; } 22.92%,95.00% { opacity: 1; } 97.50%,100% { opacity: 0; } } .c2 { animation: c2 12.0s infinite; }
    @keyframes c3 { 0%,43.33% { opacity: 0; } 46.25%,95.00% { opacity: 1; } 97.50%,100% { opacity: 0; } } .c3 { animation: c3 12.0s infinite; }
    @keyframes row { 0%,30.00% { opacity: 0; transform: translateX(16px); } 32.92%,95.00% { opacity: 1; transform: translateX(0); } 97.50%,100% { opacity: 0; } } .row { animation: row 12.0s infinite; }
    @keyframes ans { 0%,68.33% { opacity: 0; transform: translateY(6px); } 71.25%,95.00% { opacity: 1; transform: translateY(0); } 97.50%,100% { opacity: 0; } } .ans { animation: ans 12.0s infinite; }
    @keyframes purged { 0%,56.67% { opacity: 0; } 59.58%,95.00% { opacity: 1; } 97.50%,100% { opacity: 0; } } .purged { animation: purged 12.0s infinite; }
    @keyframes wave { 0%,46.67% { transform: scale(0); opacity: 0; } 47.50% { opacity: .8; } 60.00%,100% { transform: scale(1); opacity: 0; } } .wave { animation: wave 12.0s infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .wave { opacity: 0; } }
  </style>
  <rect width="960" height="420" rx="20" fill="#0f1420"/>
  <text x="40" y="66" font-size="42" font-weight="800" style="fill:url(#title)">Cloudflare MCP Server</text>
  <text x="42" y="96" font-size="16" class="muted">Zones, DNS, cache and Workers KV, in plain English.</text>

  <rect x="30" y="118" width="440" height="276" rx="16" fill="#161d2b" stroke="#2c3750"/>
  <g class="ask"><rect x="62" y="134" width="392" height="34" rx="12" fill="#2a3550"/><text x="76" y="156" font-size="13.5">Point staging at 203.0.113.10 and purge the cache</text></g>
  <g class="c1"><rect x="46" y="184" width="270" height="26" rx="8" fill="#1d2536" stroke="#f6821f"/><text x="58" y="202" font-size="12.5" class="mono" style="fill:#ffc48a">list_zones <tspan class="muted">→ example.com</tspan></text></g>
  <g class="c2"><rect x="46" y="216" width="270" height="26" rx="8" fill="#1d2536" stroke="#f6821f"/><text x="58" y="234" font-size="12.5" class="mono" style="fill:#ffc48a">create_dns_record <tspan class="muted">A · proxied</tspan></text></g>
  <g class="c3"><rect x="46" y="248" width="270" height="26" rx="8" fill="#1d2536" stroke="#f6821f"/><text x="58" y="266" font-size="12.5" class="mono" style="fill:#ffc48a">purge_cache <tspan class="muted">everything</tspan></text></g>
  <g class="ans"><rect x="46" y="292" width="408" height="84" rx="12" fill="#1d2536"/>
    <text x="60" y="318" font-size="14"><tspan font-weight="700">staging.example.com</tspan> → 203.0.113.10,</text>
    <text x="60" y="340" font-size="14">proxied through Cloudflare 🟠 and the cache is clear.</text>
    <text x="60" y="362" font-size="12" class="muted">Done in three API calls.</text></g>

  <rect x="500" y="118" width="430" height="276" rx="16" fill="#161d2b" stroke="#2c3750"/>
  <text x="520" y="146" font-size="13" font-weight="700">example.com · DNS</text>
  <g class="purged"><text x="910" y="146" text-anchor="end" font-size="11" font-weight="700" style="fill:#9ff0c4">cache purged ✓</text></g>
  <line x1="516" y1="160" x2="914" y2="160" stroke="#2c3750"/>
  <text x="520" y="186" font-size="12" class="mono" style="fill:#ffc48a">A</text><text x="580" y="186" font-size="12" class="mono">example.com</text><text x="700" y="186" font-size="12" class="mono muted">203.0.113.5</text><path d="M880 184 a6 6 0 0 1 2-11 a8 8 0 0 1 15-2 a6 6 0 0 1 6 9 z" fill="#f6821f"/><text x="520" y="216" font-size="12" class="mono" style="fill:#ffc48a">CNAME</text><text x="580" y="216" font-size="12" class="mono">www</text><text x="700" y="216" font-size="12" class="mono muted">example.com</text><path d="M880 214 a6 6 0 0 1 2-11 a8 8 0 0 1 15-2 a6 6 0 0 1 6 9 z" fill="#f6821f"/><text x="520" y="246" font-size="12" class="mono" style="fill:#ffc48a">MX</text><text x="580" y="246" font-size="12" class="mono">example.com</text><text x="700" y="246" font-size="12" class="mono muted">mail.example.com</text><path d="M880 244 a6 6 0 0 1 2-11 a8 8 0 0 1 15-2 a6 6 0 0 1 6 9 z" fill="#4a5163"/><text x="520" y="276" font-size="12" class="mono" style="fill:#ffc48a">TXT</text><text x="580" y="276" font-size="12" class="mono">example.com</text><text x="700" y="276" font-size="12" class="mono muted">"v=spf1 …"</text><path d="M880 274 a6 6 0 0 1 2-11 a8 8 0 0 1 15-2 a6 6 0 0 1 6 9 z" fill="#4a5163"/><g class="row"><rect x="510" y="288" width="410" height="26" rx="6" fill="#f6821f" fill-opacity=".12" stroke="#f6821f" stroke-opacity=".6"/><text x="520" y="306" font-size="12" class="mono" style="fill:#ffc48a">A</text><text x="580" y="306" font-size="12" class="mono" font-weight="700">staging</text><text x="700" y="306" font-size="12" class="mono">203.0.113.10</text><path d="M880 304 a6 6 0 0 1 2-11 a8 8 0 0 1 15-2 a6 6 0 0 1 6 9 z" fill="#f6821f"/></g>
  <clipPath id="panel"><rect x="500" y="118" width="430" height="276" rx="16"/></clipPath><g clip-path="url(#panel)"><circle class="wave" cx="715" cy="256" r="230" fill="none" stroke="#f6821f" stroke-width="3"/></g>
  <text x="520" y="380" font-size="11" class="muted">🟠 proxied through Cloudflare · ⚪ DNS only</text>
</svg>
